name: Build Windows EXE

on:
  workflow_dispatch:      # lets you trigger it manually from the Actions tab
  push:
    branches: [ main ]     # also runs automatically on every push to main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build the exe
        run: |
          pyinstaller --noconsole --onefile --collect-all customtkinter --name PrescriptionArchive run.py

      - name: Upload the exe as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrescriptionArchive-exe
          path: dist/PrescriptionArchive.exe
